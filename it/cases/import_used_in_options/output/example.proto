syntax = "proto3";

package example.v1;

import "custom_options.proto";

// A message where both private and public fields use custom options.
message Example {
  // Public field with custom option - should be kept along with the import
  string public_field = 2 [
    (custom.options.constraints).min_length = 1,
    (custom.options.constraints).max_length = 200
  ];
}
