syntax = "proto3";

package example.private.v1;

import "cleanapi/cleanapi.proto";
import "example/private/v1/metadata_type.proto";

option (cleanapi.file).package = "example.public.v1";

// InstanceType describes a hardware configuration.
// The Metadata field is only used in private contexts.
message InstanceType {
  string id = 1;
  string name = 2;

  // Metadata is only used by internal admin APIs
  Metadata metadata = 3 [(cleanapi.field).private = true];

  int32 cpu_cores = 4;
  int64 memory_gb = 5;
}
