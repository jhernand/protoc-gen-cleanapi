syntax = "proto3";

package example.private.v1;

import "cleanapi/cleanapi.proto";
import "google/api/annotations.proto";
import "example/private/v1/instance_type.proto";

option (cleanapi.file).package = "example.public.v1";

// ListRequest for listing instance types.
message InstanceTypesListRequest {
  optional int32 offset = 1;
  optional int32 limit = 2;
}

// ListResponse containing instance types.
message InstanceTypesListResponse {
  int32 size = 1;
  int32 total = 2;
  repeated InstanceType items = 3;
}

// GetRequest for retrieving a specific instance type.
message InstanceTypesGetRequest {
  string id = 1;
}

// GetResponse containing the requested instance type.
message InstanceTypesGetResponse {
  InstanceType object = 1;
}

// CreateRequest for creating an instance type (private only).
message InstanceTypesCreateRequest {
  option (cleanapi.message).private = true;
  InstanceType object = 1;
}

// CreateResponse after creating an instance type (private only).
message InstanceTypesCreateResponse {
  option (cleanapi.message).private = true;
  InstanceType object = 1;
}

// Service for managing instance types.
service InstanceTypes {
  // List all instance types.
  rpc List(InstanceTypesListRequest) returns (InstanceTypesListResponse) {
    option (google.api.http) = {get: "/api/private/v1/instance_types"};
  }

  // Get a specific instance type.
  rpc Get(InstanceTypesGetRequest) returns (InstanceTypesGetResponse) {
    option (google.api.http) = {
      get: "/api/private/v1/instance_types/{id}"
      response_body: "object"
    };
  }

  // Create a new instance type (private only).
  rpc Create(InstanceTypesCreateRequest) returns (InstanceTypesCreateResponse) {
    option (cleanapi.method).private = true;
    option (google.api.http) = {
      post: "/api/private/v1/instance_types"
      body: "object"
      response_body: "object"
    };
  }
}
