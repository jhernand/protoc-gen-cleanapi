syntax = "proto3";

package example.private.v1;

import "cleanapi/cleanapi.proto";

option (cleanapi.file).package = "example.public.v1";

// InstanceType describes a hardware configuration.
message InstanceType {
  string id = 1;
  string name = 2;
  InstanceTypeSpec spec = 3;
}

// InstanceTypeSpec contains the specifications.
message InstanceTypeSpec {
  int32 cpu_cores = 1;
  int64 memory_gb = 2;
  string internal_config = 3 [(cleanapi.field).private = true];
}
